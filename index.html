  function H(t, st) { return T.h ? T.h(t, st) : '<h2' + (st ? ' style="' + st + '"' : '') + '>' + t + '</h2>'; }
  var h = '<header class="hero" style="--ph:' + url(F_UTAMA).replace(/"/g, '&quot;') + '">' + (T.heroDeco || '') + '<div class="t">Khitanan Putra Kami</div><h1>' + e(nama) + '</h1><div class="full">' + e(P.nama) + '</div>'
    + (ok ? '<div class="pill">' + HARI[dd.getDay()] + ', ' + dd.getDate() + ' ' + BLN[dd.getMonth()] + ' ' + dd.getFullYear() + '</div>' : '')
    + '<div class="cd" id="cd"><div><b>0</b><small>Hari</small></div><div><b>0</b><small>Jam</small></div><div><b>0</b><small>Menit</small></div><div><b>0</b><small>Detik</small></div></div>' + wave('#F4FAFF') + '</header>';
  h += '<section class="sec">' + H('Assalamu’alaikum Warahmatullahi Wabarakatuh','') + '<p class="sm" style="margin-bottom:22px">Dengan memohon rahmat dan ridho Allah SWT, kami mengundang Bapak/Ibu/Saudara/i untuk hadir dan mendoakan putra kami dalam acara khitanan.</p>'
    + '<div class="arch" style="--ph:' + url(F_BINGKAI).replace(/"/g, '&quot;') + '"></div><h3 style="font-size:1.6rem;color:var(--nv)">' + e(P.nama) + '</h3>'
    + '<div class="par"><span>' + (P.putraKe ? 'Putra ke-' + e(P.putraKe) + ' dari' : 'Putra dari') + '</span><b>Bpk. ' + e(P.ayah) + '</b><span>dan</span><b>Ibu ' + e(P.ibu) + '</b></div></section>' + wave('#14284B').replace('<svg', '<svg style="background:var(--cl)"');
  function tiket(a) {
    var d = new Date(a.tanggal + 'T00:00:00'), v = !isNaN(d);
    return '<div class="tk">' + (v ? '<div class="dt"><b>' + d.getDate() + '</b><span>' + BLN[d.getMonth()] + ' ' + d.getFullYear() + '</span></div><div class="hr">' + HARI[d.getDay()] + '</div>' : '') + '<div class="jm">' + e(jam(a)) + '</div><div class="tp">' + e(a.tempat) + '</div><div class="al">' + e(a.alamat) + '</div>'
      + (a.maps ? '<a class="btn" href="' + e(a.maps) + '" target="_blank" rel="noopener">Buka Google Maps</a>' : '') + '</div>';
  }
  h += '<section class="sec band" style="padding-top:20px">' + H('Acara Khitanan','') + '' + tiket(A) + (D.syukuran ? '' + H('Syukuran','margin:34px 0 14px') + '' + tiket(D.syukuran) : '') + '</section>';
  if (G.length) h += '<section class="sec" id="gal">' + H('Galeri Foto','') + '<div class="gl">' + G.map(function (s, i) { return '<button type="button" data-i="' + i + '" aria-label="Perbesar foto ' + (i + 1) + '"><img src="' + e(s) + '" alt="Foto ' + e(nama) + ' ' + (i + 1) + '" loading="lazy"></button>'; }).join('') + '</div></section>';
  h += '<section class="sec band" id="ucs">' + H('Ucapan &amp; Doa','') + '<p class="sm" style="margin-bottom:18px">Tulis ucapan dan doa untuk ' + e(nama) + '. Konfirmasi kehadiran Anda juga bisa lewat sini.</p>'
    + '<form id="fu"><label for="un">Nama</label><input id="un" required maxlength="40" value="' + (tamu === 'Tamu Undangan' ? '' : e(tamu)) + '"><label for="up">Ucapan</label><textarea id="up" required maxlength="300" placeholder="Tulis ucapan dan doa terbaik Anda"></textarea>'
    + '<label for="uh">Kehadiran</label><select id="uh"><option>Hadir</option><option>Belum bisa hadir</option><option>Masih ragu</option></select>'
    + (D.pemesan && D.pemesan.whatsapp ? '<label class="ck"><input type="checkbox" id="uw" checked> Kirim juga ke WhatsApp tuan rumah</label>' : '') + '<button class="btn" type="submit">Kirim ucapan</button></form><p class="sm" id="ucn" style="margin-top:14px" hidden></p><div class="uc" id="uc" aria-live="polite"></div></section>';
  if (TM.length) h += '<section class="sec" id="tms">' + H('Turut Mengundang','') + '<ul class="tm">' + TM.map(function (n) { return '<li>' + e(n) + '</li>'; }).join('') + '</ul></section>';
  if (HD.length) h += '<section class="sec" id="hds" style="padding-top:10px">' + H('Tanda Kasih','') + '<p class="sm">Doa restu Anda sudah menjadi hadiah terindah. Bila ingin berbagi tanda kasih, dapat melalui:</p>' + HD.map(function (r, i) { return '<div class="rk" data-i="' + i + '"><small>' + e(r.bank) + '</small><b>' + e(r.nomor) + '</b><small>a.n. ' + e(r.atasNama) + '</small><button class="cp" type="button" data-n="' + e(r.nomor) + '">Salin nomor</button></div>'; }).join('') + '</section>';
  h += '<footer class="end" style="--ph:' + url(F_PENUTUP).replace(/"/g, '&quot;') + '"><p class="sm">Merupakan kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir dan memberikan doa restu.</p><p class="sm" style="margin-top:12px">Wassalamu’alaikum Warahmatullahi Wabarakatuh</p><div class="nm">Bpk. ' + e(P.ayah) + ' &amp; Ibu ' + e(P.ibu) + '</div></footer>';
  isi.innerHTML = h; if (T.after) T.after({ cv: cv, isi: isi });
  function toast(t) { var x = document.getElementById('to2'); x.textContent = t; x.classList.add('on'); setTimeout(function () { x.classList.remove('on'); }, 2200); }
  /* galeri + pembesar foto */
  var lb = document.getElementById('lb'), li = lb.firstElementChild;
  [].forEach.call(isi.querySelectorAll('.gl button'), function (bt) {
    var img = bt.firstElementChild;
    if (img && img.tagName === 'IMG') {
      img.onerror = function () { bt.remove(); if (!isi.querySelector('.gl button')) { var s = document.getElementById('gal'); if (s) s.remove(); } };
    }
    bt.onclick = function () {
      if (!li) return;
      var idx = bt.getAttribute('data-i');
      li.src = G[idx] || '';
      lb.classList.add('on');
    };
  });
  lb.onclick = function () { lb.classList.remove('on'); };
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') lb.classList.remove('on'); });
  /* ucapan: dengan Firebase -> dibaca bersama semua tamu; tanpa Firebase -> hanya di perangkat ini */
  var KEY = 'ucapan-' + (D.kode || nama) + '-' + (A.tanggal || ''), mine = [];
  try { mine = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (x) { mine = []; }
  var uc = document.getElementById('uc'), warna = ['#2F6DB5', '#FF8A5B', '#3B9E78', '#8E6BBF', '#D9A21E', '#D6517D'];
  var online = FB.ok(D), publik = D.ucapanPublik !== false, srv = [], ucNote = document.getElementById('ucn');
  function bubble(u) {
    var d = document.createElement('div'), a = document.createElement('div'), c = document.createElement('div'), b = document.createElement('b'), p = document.createElement('p');
    d.className = 'bb'; a.className = 'av'; a.textContent = String(u.nama || '?').charAt(0).toUpperCase(); a.style.background = warna[(String(u.nama).length + String(u.nama).charCodeAt(0)) % 6];
    b.textContent = u.nama; if (u.hadir) { var m = document.createElement('em'); m.textContent = u.hadir; b.appendChild(m); } p.textContent = u.pesan; c.appendChild(b); c.appendChild(p); d.appendChild(a); d.appendChild(c);
    uc.appendChild(d);
  }
  /* tampil/sembunyi bagian sesuai pengaturan klien (panel admin), bila belum diatur pakai data-undangan.js */
  function terapkan(s) {
    s = s || {};
    var t = document.getElementById('tms'), h = document.getElementById('hds'), n = 0;
    if (t) t.hidden = typeof s.turutMengundang === 'boolean' ? !s.turutMengundang : D.turutMengundangTampil === false;
    [].forEach.call(isi.querySelectorAll('.rk'), function (r) {
      var i = r.getAttribute('data-i'), on = typeof s['rek' + i] === 'boolean' ? s['rek' + i] : HD[i].tampil !== false;
      r.hidden = !on; if (on) n++;
    });
    if (h) h.hidden = !n;
  }
  terapkan();
  function paint() {
    var list = !online ? mine.concat(D.ucapan || []) : publik ? srv.concat(D.ucapan || []) : mine;
    uc.textContent = '';
    ucNote.textContent = online && !publik ? 'Ucapan Anda disampaikan langsung kepada tuan rumah.' : '';
    ucNote.hidden = !ucNote.textContent;
    uc.hidden = online && !publik && !list.length;
    if (!list.length) { if (!uc.hidden) uc.innerHTML = '<p class="sm" style="text-align:center;color:#fff">Belum ada ucapan. Jadilah yang pertama.</p>'; return; }
    list.forEach(bubble);
  }
  function muat() {
    if (!online) return paint();
    FB.getPengaturan(D).then(function (s) {
      if (typeof s.ucapanPublik === 'boolean') publik = s.ucapanPublik;
      terapkan(s);
      return publik ? FB.listUcapan(D) : [];
    }).then(function (l) { srv = l; paint(); }).catch(function () { paint(); });
  }
  paint(); muat();
  if (online) setInterval(function () { if (!document.hidden && !document.activeElement.matches('#up')) muat(); }, 30000);
  document.getElementById('fu').onsubmit = function (ev) {
    ev.preventDefault();
    var u = {nama: document.getElementById('un').value.trim(), pesan: document.getElementById('up').value.trim(), hadir: document.getElementById('uh').value};
    if (!u.nama || !u.pesan) return;
    var w = document.getElementById('uw'), no = String(D.pemesan && D.pemesan.whatsapp || '').replace(/\D/g, ''), btn = ev.target.querySelector('button[type=submit]');
    var wa = w && w.checked && no ? 'https://wa.me/' + no + '?text=' + encodeURIComponent('Assalamu’alaikum, saya ' + u.nama + '. Ucapan untuk ' + nama + ': ' + u.pesan + ' (Kehadiran: ' + u.hadir + ')') : '';
    var win = wa ? window.open('', '_blank') : null;
    function selesai() {
      mine.unshift(u); try { localStorage.setItem(KEY, JSON.stringify(mine.slice(0, 30))); } catch (x) {}
      document.getElementById('up').value = ''; toast('Ucapan terkirim. Terima kasih!');
      if (wa) { if (win) win.location = wa; else window.open(wa, '_blank'); }
      paint(); uc.scrollTop = 0;
    }
    if (!online) return selesai();
    btn.disabled = true;
    FB.addUcapan(D, u).then(function () { if (publik) srv.unshift(u); selesai(); })
      .catch(function () { if (win) win.close(); toast('Gagal mengirim. Periksa internet lalu coba lagi.'); })
      .then(function () { btn.disabled = false; });
  };
  [].forEach.call(isi.querySelectorAll('.cp'), function (b) {
    b.onclick = function () {
      var n = b.getAttribute('data-n'), done = function () { b.textContent = 'Tersalin'; b.classList.add('ok'); setTimeout(function () { b.textContent = 'Salin nomor'; b.classList.remove('ok'); }, 1800); };
      if (navigator.clipboard) navigator.clipboard.writeText(n).then(done, function () { prompt('Salin nomor:', n); }); else prompt('Salin nomor:', n);
    };
  });
  /* animasi muncul saat di-scroll (hero dimainkan saat undangan dibuka) */
  var anim = !window.matchMedia('(prefers-reduced-motion: reduce)').matches && 'IntersectionObserver' in window, heroEls = [];
  function selesai(el) { setTimeout(function () { el.classList.remove('rv', 'z', 'l', 'r', 'pop', 'in'); el.style.removeProperty('--dl'); }, 1700); }
  if (anim) {
    var io = new IntersectionObserver(function (es) {
      var k = 0;
      es.forEach(function (en) {
        if (!en.isIntersecting) return;
        var el = en.target; io.unobserve(el);
        el.style.setProperty('--dl', Math.min(k++, 5) * 0.09 + 's'); el.classList.add('in'); selesai(el);
      });
    }, { threshold: 0.12, rootMargin: '0px 0px -6% 0px' });
    function tandai(sel, v) { [].forEach.call(isi.querySelectorAll(sel), function (el) { el.classList.add('rv'); if (v) el.classList.add(v); io.observe(el); }); }
    tandai('.sec > h2'); tandai('.sec > .sm'); tandai('.arch', 'z'); tandai('.sec > h3'); tandai('.par', 'pop'); tandai('.tk', 'z');
    tandai('.gl button', 'z'); tandai('form', 'pop'); tandai('.uc'); tandai('.rk', 'pop'); tandai('.end > *');
    [].forEach.call(isi.querySelectorAll('.tm li'), function (el, i) { el.classList.add('rv', i % 2 ? 'r' : 'l'); io.observe(el); });
    [].forEach.call(isi.querySelectorAll('.hero > *:not(.wv)'), function (el) { el.classList.add('rv', 'pop'); heroEls.push(el); });
  }
  /* hitung mundur */
  var T = new Date(A.tanggal + 'T' + (A.jamMulai || '00:00') + ':00').getTime(), cd = document.getElementById('cd'), iv;
  function tick() {
    var s = Math.floor((T - Date.now()) / 1000), b = cd.querySelectorAll('b');
    if (isNaN(s)) { cd.hidden = true; clearInterval(iv); return; }
    if (s <= 0) { cd.outerHTML = '<div class="pill" style="margin-top:20px">Acara sedang atau telah berlangsung</div>'; clearInterval(iv); return; }
    b[0].textContent = Math.floor(s / 86400); b[1].textContent = Math.floor(s % 86400 / 3600); b[2].textContent = Math.floor(s % 3600 / 60); b[3].textContent = s % 60;
  }
  iv = setInterval(tick, 1000); tick();

  var au = null, mb = null, MU = String(D.musik || '');
  if (/\.(mp3|m4a|ogg|wav)$/i.test(MU)) {
    au = new Audio(MU); au.loop = true; au.preload = 'none';
    mb = document.createElement('button'); mb.className = 'mu'; mb.type = 'button'; mb.hidden = true; mb.setAttribute('aria-label', 'Putar atau hentikan musik'); mb.innerHTML = '<i></i><i></i><i></i>'; document.body.appendChild(mb);
    mb.onclick = function () { if (au.paused) { au.play().then(function () { mb.classList.add('on'); }, function () {}); } else { au.pause(); mb.classList.remove('on'); } };
  }
  document.getElementById('buka').onclick = function () {
    if (au) { mb.hidden = false; au.play().then(function () { mb.classList.add('on'); }, function () {}); }
    cv.classList.add('go'); document.body.classList.remove('lock');
    heroEls.forEach(function (el, i) { setTimeout(function () { el.classList.add('in'); selesai(el); }, 650 + i * 130); }); isi.removeAttribute('aria-hidden'); window.scrollTo(0, 0);
    if (T.onOpen) T.onOpen(FXI);
    setTimeout(function () { cv.style.display = 'none'; }, T.hide || 1800);
  };
})();
</script>
</body></html>
